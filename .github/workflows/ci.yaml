name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    unit:
        name: Build & unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm test

    e2e:
        name: E2E tests (live RPC)
        runs-on: ubuntu-latest
        # Needs the MAIN_RPC_URL secret, which is not available to fork PRs
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run test:e2e
              env:
                  MAIN_RPC_URL: ${{ secrets.MAIN_RPC_URL }}
